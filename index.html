<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stream Social Overlay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Teko:wght@700&family=Outfit:wght@700&family=Russo+One&display=swap" rel="stylesheet">
    <style>
        body { background: transparent; overflow: hidden; margin: 0; padding: 24px; display: flex; align-items: center; justify-content: center; }
        .style-sapphire { background: rgba(10, 19, 40, 0.6); border: 2px solid #1e40af; box-shadow: 0 0 22px rgba(30, 64, 175, 0.6); color: #fff; }
        .style-azure { background: linear-gradient(135deg, rgba(14, 116, 144, 0.6), rgba(3, 105, 161, 0.6)); border: 2px solid #38bdf8; box-shadow: 0 8px 25px rgba(56, 189, 248, 0.45); color: #fff; }
        .style-icefrost { background: rgba(186, 230, 253, 0.6); backdrop-filter: blur(18px); border: 2px solid rgba(224, 242, 254, 0.8); color: #fff; }
        .style-cobalt { background: rgba(15, 23, 42, 0.6); border-left: 6px solid #2563eb; color: #fff; }
        .style-cyberblue { background: linear-gradient(135deg, rgba(8, 20, 44, 0.6), rgba(15, 45, 90, 0.6)); border: 2px solid #06b6d4; box-shadow: 0 0 24px rgba(6, 182, 212, 0.55); color: #fff; }
    </style>
</head>
<body>
    <!-- Active Handles: TikTok: @raphsodyyy_, Twitch: @raphsodyy_, YouTube: @Papaeng, Instagram: @rdvldz -->
    <div id="overlayWidget" class="transition-all duration-300 font-orbitron" style="--accent-color: #60a5fa; --accent-color-alpha: #60a5fa55; --bg-opacity: 0.6; transform: scale(1.15);"><div class="flex flex-wrap items-center justify-center gap-4">
                <div class="style-glacier animate-shine flex items-center space-x-3 px-4 py-2.5 rounded-2xl transition duration-300 hover:scale-105 select-none relative shadow-lg">
                    <div class="w-8 h-8 rounded-xl flex items-center justify-center text-white text-sm shadow-md relative" style="background-color: #FE2C55">
                        <i class="fa-brands fa-tiktok"></i>
                    </div>
                    <div class="flex flex-col leading-tight pr-1.5">
                        <span class="text-[11px] uppercase font-bold tracking-wider opacity-80" style="color:#94a3b8;">TikTok</span>
                        <span class="text-sm font-extrabold tracking-wide" style="color:#ffffff;">@raphsodyyy_</span>
                    </div>
                    
                </div>
            
                <div class="style-glacier animate-shine flex items-center space-x-3 px-4 py-2.5 rounded-2xl transition duration-300 hover:scale-105 select-none relative shadow-lg">
                    <div class="w-8 h-8 rounded-xl flex items-center justify-center text-white text-sm shadow-md relative" style="background-color: #9146FF">
                        <i class="fa-brands fa-twitch"></i>
                    </div>
                    <div class="flex flex-col leading-tight pr-1.5">
                        <span class="text-[11px] uppercase font-bold tracking-wider opacity-80" style="color:#94a3b8;">Twitch</span>
                        <span class="text-sm font-extrabold tracking-wide" style="color:#ffffff;">@raphsodyy_</span>
                    </div>
                    
                </div>
            
                <div class="style-glacier animate-shine flex items-center space-x-3 px-4 py-2.5 rounded-2xl transition duration-300 hover:scale-105 select-none relative shadow-lg">
                    <div class="w-8 h-8 rounded-xl flex items-center justify-center text-white text-sm shadow-md relative" style="background-color: #FF0000">
                        <i class="fa-brands fa-youtube"></i>
                    </div>
                    <div class="flex flex-col leading-tight pr-1.5">
                        <span class="text-[11px] uppercase font-bold tracking-wider opacity-80" style="color:#94a3b8;">YouTube</span>
                        <span class="text-sm font-extrabold tracking-wide" style="color:#ffffff;">@Papaeng</span>
                    </div>
                    
                </div>
            
                <div class="style-glacier animate-shine flex items-center space-x-3 px-4 py-2.5 rounded-2xl transition duration-300 hover:scale-105 select-none relative shadow-lg">
                    <div class="w-8 h-8 rounded-xl flex items-center justify-center text-white text-sm shadow-md relative" style="background-color: #E1306C">
                        <i class="fa-brands fa-instagram"></i>
                    </div>
                    <div class="flex flex-col leading-tight pr-1.5">
                        <span class="text-[11px] uppercase font-bold tracking-wider opacity-80" style="color:#94a3b8;">Instagram</span>
                        <span class="text-sm font-extrabold tracking-wide" style="color:#ffffff;">@rdvldz</span>
                    </div>
                    
                </div>
            </div></div>
</body>
</html>
